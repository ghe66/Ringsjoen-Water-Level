<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ringsjön – Station Finder</title>
<style>
  body { background:#05100a; color:#c8e6d0; font-family:monospace; padding:28px 20px; }
  h1 { color:#34b464; font-size:20px; margin-bottom:20px; }
  button { padding:12px 24px; background:transparent; border:1px solid #34b464; border-radius:4px; color:#34b464; font-family:monospace; font-size:12px; cursor:pointer; letter-spacing:0.1em; }
  #out { margin-top:24px; font-size:11px; line-height:2; white-space:pre-wrap; color:#3a6b4a; }
  .hit { color:#2dd4bf; font-weight:bold; }
</style>
</head>
<body>
<h1>SMHI Station Finder – Parameter 7 (Vattenstånd)</h1>
<button onclick="run()">LISTA ALLA STATIONER</button>
<div id="out"></div>
<script>
const API = 'https://opendata-download-hydroobs.smhi.se/api/version/1.0';
const out = document.getElementById('out');

function ts(ms) {
  if (!ms) return '?';
  try { return new Date(Number(ms)).toISOString().slice(0,10); } catch { return '?'; }
}

async function run() {
  out.textContent = 'Hämtar stationslista...';
  const res = await fetch(`${API}/parameter/7.json`);
  const data = await res.json();
  const stations = data.station || [];
  out.textContent = `Totalt ${stations.length} stationer:\n\n`;

  for (const s of stations) {
    // Fetch period info for each station
    try {
      const r2 = await fetch(`${API}/parameter/7/station/${s.id}.json`);
      const d2 = await r2.json();
      const periods = (d2.period || []).map(p => `${p.key}(${ts(p.from)}→${ts(p.to)})`).join(' | ');
      const isRing = (s.name||'').toLowerCase().includes('ring');
      const line = `ID:${s.id}  ${s.name}  ${periods}\n`;
      if (isRing) {
        const span = document.createElement('span');
        span.className = 'hit';
        span.textContent = '★ ' + line;
        out.appendChild(span);
      } else {
        out.appendChild(document.createTextNode(line));
      }
    } catch(e) {
      out.appendChild(document.createTextNode(`ID:${s.id}  ${s.name}  (fel: ${e.message})\n`));
    }
  }
}
</script>
</body>
</html>
