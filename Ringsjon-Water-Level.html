<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMHI URL Tester</title>
<style>
  body { background:#05100a; color:#c8e6d0; font-family:monospace; padding:28px 20px; }
  h1 { color:#34b464; font-size:18px; margin-bottom:8px; }
  p  { color:#3a6b4a; font-size:11px; margin-bottom:20px; }
  button { padding:12px 24px; background:transparent; border:1px solid #34b464; border-radius:4px; color:#34b464; font-family:monospace; font-size:12px; cursor:pointer; letter-spacing:0.1em; }
  #out { margin-top:24px; font-size:11px; line-height:2; white-space:pre-wrap; }
  .ok  { color:#34b464; }
  .err { color:#f87171; }
</style>
</head>
<body>
<h1>SMHI Station 2176 – URL Tester</h1>
<p>Testar olika API-URL:er för Ringsjödammen övre (station 2176)</p>
<button onclick="run()">TESTA</button>
<div id="out"></div>
<script>
const out = document.getElementById('out');

function append(text, cls) {
  const s = document.createElement('span');
  s.className = cls || '';
  s.textContent = text + '\n';
  out.appendChild(s);
}

const URLS = [
  // Meteorological observations API (different from hydroobs)
  'https://opendata-download-metobs.smhi.se/api/version/1.0/parameter/7/station/2176/period/corrected-archive/data.csv',
  'https://opendata-download-metobs.smhi.se/api/version/1.0/parameter/7/station/2176/period/latest-months/data.csv',
  // Hydro with station 2176
  'https://opendata-download-hydroobs.smhi.se/api/version/1.0/parameter/7/station/2176/period/corrected-archive/data.csv',
  'https://opendata-download-hydroobs.smhi.se/api/version/1.0/parameter/7/station/2176/period/latest-months/data.csv',
  'https://opendata-download-hydroobs.smhi.se/api/version/1.0/parameter/7/station/2176/period/latest-day/data.csv',
  // Try station 2176 info page
  'https://opendata-download-hydroobs.smhi.se/api/version/1.0/parameter/7/station/2176.json',
  // Try the SE.ACMF dataset mentioned on SMHI's page
  'https://opendata-download-hydroobs.smhi.se/api/version/1.0/parameter/SE.ACMF/station/2176/period/corrected-archive/data.csv',
];

async function run() {
  out.textContent = '';
  for (const url of URLS) {
    try {
      const short = url.replace('https://opendata-download-', '').replace('.smhi.se','');
      const res = await fetch(url);
      const text = await res.text();
      const preview = text.slice(0, 120).replace(/\n/g, ' ');
      if (res.ok) {
        append(`✓ HTTP ${res.status}  ${short}\n  → ${preview}`, 'ok');
      } else {
        append(`✗ HTTP ${res.status}  ${short}`, 'err');
      }
    } catch(e) {
      append(`✗ FEL: ${url.slice(0,60)}…  ${e.message}`, 'err');
    }
  }
  append('\nKLAR');
}
</script>
</body>
</html>
